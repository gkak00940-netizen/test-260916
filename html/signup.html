<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 고흥사랑 카페</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav id="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">고흥사랑</a>
      <ul class="nav-links">
        <li><a href="../index.html#about">About</a></li>
        <li><a href="../index.html#menu">Menu</a></li>
        <li><a href="../index.html#location">Location</a></li>
        <li><a href="../index.html#contact">Contact</a></li>
        <li><a href="login.html" class="nav-login">Login</a></li>
      </ul>
      <button class="nav-toggle" aria-label="메뉴 열기">☰</button>
    </div>
  </nav>

  <!-- Sign Up -->
  <section id="signup" class="login-section">
    <div class="login-card">
      <h1 class="section-title">Sign Up</h1>
      <p class="login-subtitle">고흥사랑의 회원이 되어주세요.</p>

      <form id="signup-form">
        <div class="form-group">
          <label for="signup-name">이름</label>
          <input type="text" id="signup-name" name="name" placeholder="홍길동" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="signup-email">이메일</label>
          <input type="email" id="signup-email" name="email" placeholder="example@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="signup-password">비밀번호</label>
          <input type="password" id="signup-password" name="password" placeholder="6자 이상 입력해주세요." autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="signup-password-confirm">비밀번호 확인</label>
          <input type="password" id="signup-password-confirm" name="password-confirm" placeholder="비밀번호를 한 번 더 입력해주세요." autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn login-btn">회원가입</button>
        <p id="signup-msg" class="login-msg" hidden></p>
      </form>

      <p class="login-switch">이미 회원이신가요? <a href="login.html">로그인</a></p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>© 2026 고흥사랑. All rights reserved.</p>
      <p>전라남도 고흥군 고흥읍 고흥로 12 · 061-000-0000</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/signup.js"></script>
</body>
</html>
